<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusPulse</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>CampusPulse</h1>
    <div class="badges" id="badges" aria-live="polite">
      <span class="badge badge--loading" id="mode-badge">連線中…</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel panel--map" aria-labelledby="map-title">
      <h2 id="map-title">校園無障礙地圖</h2>
      <div class="placeholder" id="map">
        <p>地圖在 M3 接上 Leaflet。目前顯示圖資摘要：</p>
        <dl id="graph-summary"></dl>
      </div>
    </section>

    <section class="panel panel--timeline" aria-labelledby="timeline-title">
      <h2 id="timeline-title">時間軸</h2>
      <p class="clock" id="clock">--:--</p>
      <div class="controls">
        <button id="btn-reset" type="button">重設回放</button>
        <button id="btn-advance" type="button">前進 5 分鐘</button>
      </div>
      <h3>今日行程</h3>
      <ul id="commitments" class="list"></ul>
      <h3>目前訊號</h3>
      <ul id="signals" class="list"></ul>
    </section>

    <section class="panel panel--log" aria-labelledby="log-title">
      <h2 id="log-title">Agent 紀錄</h2>
      <ol id="agent-log" class="log"></ol>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
